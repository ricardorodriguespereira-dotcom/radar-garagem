name: Radar

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      nicho:
        description: "Nicho"
        type: choice
        options: [carros, reforma, investimentos]
        default: carros

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar o radar
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python radar.py --nicho "${{ inputs.nicho || 'carros' }}"
      - name: Guardar o relatório no histórico
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add relatorios
          git commit -m "Relatório $(date '+%d/%m/%Y %H:%M')" || echo "nada novo"
          git push
      - name: Montar o site
        run: python montar_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
