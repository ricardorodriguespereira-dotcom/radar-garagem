name: Desempenho

on:
  schedule:
    - cron: "17 13 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  desempenho:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Medir o canal
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CANAL: ${{ vars.CANAL }}
        run: python desempenho.py
      - name: Guardar
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git pull --rebase || true
          git add desempenho
          git commit -m "Desempenho $(date '+%d/%m/%Y')" || echo "nada novo"
          git push
